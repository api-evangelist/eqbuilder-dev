  /api/scoreboard:
    get:
      summary: Get Scoreboard
      description: 'Public scoreboard: flagship AI assistants scored for human-likeness by the

        real EqBuilder scoring engine. JSON by default; browsers/unfurlers

        (Accept: text/html) get a shareable HTML page with OG meta tags.'
      operationId: get_scoreboard_api_scoreboard_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Scoreboard
