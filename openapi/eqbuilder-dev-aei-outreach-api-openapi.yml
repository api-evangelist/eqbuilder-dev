openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: 'Human-likeness scoring and AI text benchmark API. Score AI-generated text against real human personality profiles (EQ, formality, directness, hesitation, response-timing cadence) to measure how human your AI writing sounds before you ship it. Built for autonomous agents and AI text humanizer pipelines: free stateless scoring at /api/score, paid validated benchmarks via machine-to-machine On-chain settlement with x402 support — the default path is gasless USDC on Base (unpaid calls to /api/simulate return HTTP 402 with machine-readable payment requirements; sign the Base requirement and retry once with PAYMENT-SIGNATURE). Legacy SOL and X-PAYMENT clients remain compatible. Interactive API docs are available at /api/docs. Permanent tool setup (wire it in once and explicitly authorize a dedicated USDC-on-Base burner wallet so the SDK can sign paid calls without a human): see the ''Permanent tool setup'' section of /llms.txt and the crawlable guide at /guides/permanent-agent-tool-setup.html. Live network stats (real ledger aggregates) at /api/stats; runnable Python/JS quickstart examples ship in the repo under examples/.'
  version: 1.0.0
tags:
- name: AEI outreach
paths:
  /api/operator/aei-outreach/drafts:
    get:
      tags:
      - AEI outreach
      summary: List Drafts
      operationId: list_drafts_api_operator_aei_outreach_drafts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/operator/aei-outreach/research:
    post:
      tags:
      - AEI outreach
      summary: Research
      operationId: research_api_operator_aei_outreach_research_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/operator/aei-outreach/drafts/{draft_id}:
    patch:
      tags:
      - AEI outreach
      summary: Review Draft
      operationId: review_draft_api_operator_aei_outreach_drafts__draft_id__patch
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: integer
          title: Draft Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ProspectInput:
      properties:
        company_name:
          type: string
          maxLength: 160
          minLength: 1
          title: Company Name
        official_url:
          type: string
          maxLength: 2048
          minLength: 1
          title: Official Url
        contact_url:
          type: string
          maxLength: 2048
          minLength: 1
          title: Contact Url
        contact_channel:
          type: string
          title: Contact Channel
      type: object
      required:
      - company_name
      - official_url
      - contact_url
      - contact_channel
      title: ProspectInput
    ReviewUpdate:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: ReviewUpdate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ResearchRequest:
      properties:
        prospects:
          items:
            $ref: '#/components/schemas/ProspectInput'
          type: array
          maxItems: 5
          minItems: 1
          title: Prospects
      type: object
      required:
      - prospects
      title: ResearchRequest
