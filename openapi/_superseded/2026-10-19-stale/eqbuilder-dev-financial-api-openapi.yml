openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: Human-likeness scoring and AI text benchmark API.
  version: 1.0.0
tags:
- name: Financial
paths:
  /api/financial/snapshots:
    get:
      summary: Financial Snapshots
      description: 'Recent rows from the financial audit trail written by the background

        financial-ops worker (every 5 minutes): SOL/USD spot price, change vs the

        previous snapshot, spike flag, total ASSESSED charged lamports, and their

        USD value at spot. Ledger figures are assessed charges recorded by the

        platform (see /api/stats note) — not independently on-chain-verified

        settlements. Rows are returned oldest-first for charting. Read-only.'
      operationId: financial_snapshots_api_financial_snapshots_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 288
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Financial
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
