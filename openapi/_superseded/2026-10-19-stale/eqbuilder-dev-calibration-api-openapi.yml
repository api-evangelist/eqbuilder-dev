openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: Human-likeness scoring and AI text benchmark API.
  version: 1.0.0
tags:
- name: Calibration
paths:
  /api/calibration/uptake:
    get:
      summary: Calibration Uptake
      description: 'Public, aggregate-only view of the calibration-sharing program: how many

        consented contributions exist per profile, plus the current discount.

        Contains no response text or wallet addresses.'
      operationId: calibration_uptake_api_calibration_uptake_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Calibration
  /api/calibration/contributions:
    get:
      summary: List Calibration Contributions
      description: 'Operator-only review of consented calibration contributions (wallet,

        profile, score, text, delay, date). Bots opted in explicitly via

        share_for_calibration=true; the program promises this data is used for

        manual operator calibration review only, so this endpoint requires the

        admin token (X-Admin-Token header).'
      operationId: list_calibration_contributions_api_calibration_contributions_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: profile
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Calibration
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
