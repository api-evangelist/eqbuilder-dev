openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: Human-likeness scoring and AI text benchmark API.
  version: 1.0.0
tags:
- name: Health Capacity
paths:
  /api/health-capacity:
    get:
      summary: Health Capacity
      description: 'Isolated in-process CPU benchmark for the EQ scoring engine''s string-parsing

        path. Uses only local mock data — no database, no ledger writes, no wallets,

        no network. Safe to run against production without affecting live volume.


        Returns raw throughput metrics for capacity planning.'
      operationId: health_capacity_api_health_capacity_get
      parameters:
      - name: iterations
        in: query
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          default: 2000
          title: Iterations
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Health Capacity
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
