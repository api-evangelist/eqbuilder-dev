  /api/storelayer/free-installs/{workflow_id}/live-verification:
    post:
      summary: Verify Storelayer Free Installation Live
      operationId: verify_storelayer_free_installation_live_api_storelayer_free_installs__workflow_id__live_verification_post
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Storelayer
  /api/storelayer/agent/catalog:
    get:
      summary: Storelayer Agent Catalog
      operationId: storelayer_agent_catalog_api_storelayer_agent_catalog_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Storelayer
  /api/storelayer/agent/quotes:
    post:
      summary: Storelayer Agent Purchase Quote
      operationId: storelayer_agent_purchase_quote_api_storelayer_agent_quotes_post
      responses:
        '200':
