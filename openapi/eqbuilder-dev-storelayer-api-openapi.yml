components:
  schemas:
    StorelayerFreeInstallStart:
      properties:
        origin:
          type: string
          title: Origin
        widget_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Widget Id
        storefront_need:
          anyOf:
          - type: string
          - type: 'null'
          title: Storefront Need
      additionalProperties: false
      type: object
      required:
      - origin
      title: StorelayerFreeInstallStart
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    StorelayerMatchInput:
      properties:
        job:
          type: string
          title: Job
        source:
          type: string
          title: Source
          default: catalog_matcher
      type: object
      required:
      - job
      title: StorelayerMatchInput
