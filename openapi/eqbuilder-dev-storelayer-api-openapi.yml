  /api/storelayer/free-installs/{workflow_id}/code:
    get:
      summary: Get Storelayer Free Installation Code
      operationId: get_storelayer_free_installation_code_api_storelayer_free_installs__workflow_id__code_get
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
