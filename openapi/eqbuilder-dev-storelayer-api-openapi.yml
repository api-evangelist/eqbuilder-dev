  /api/storelayer/agent/payments/{quote_id}:
    post:
      summary: Storelayer Agent Settle
      operationId: storelayer_agent_settle_api_storelayer_agent_payments__quote_id__post
      parameters:
      - name: quote_id
        in: path
        required: true
        schema:
          type: string
          title: Quote Id
      - name: X-PAYMENT
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Payment
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
