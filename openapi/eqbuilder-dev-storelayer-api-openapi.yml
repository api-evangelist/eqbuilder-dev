        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Storelayer
  /api/storelayer/free-installs/{workflow_id}/challenge-published:
    post:
      summary: Storelayer Free Install Challenge Published
      operationId: storelayer_free_install_challenge_published_api_storelayer_free_installs__workflow_id__challenge_published_post
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Storelayer
  /api/storelayer/free-installs/{workflow_id}/installation:
    post:
      summary: Create Storelayer Free Installation
      operationId: create_storelayer_free_installation_api_storelayer_free_installs__workflow_id__installation_post
      parameters:
      - name: workflow_id
        in: path
        required: true
