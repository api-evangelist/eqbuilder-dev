openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: Human-likeness scoring and AI text benchmark API.
  version: 1.0.0
tags:
- name: Storelayer
paths:
  /api/storelayer/recommend:
    get:
      summary: Storelayer Recommend
      description: 'One-call, read-only recommendation from the verified Storelayer snapshot.


        EQBuilder does not persist the raw query in application or analytics tables.

        Because this is GET, the URL can still appear in browser history, proxy/access

        logs, referrers, copied links, and crawler indexes. Use short, non-sensitive

        capability keywords only; never include PII or secrets.'
      operationId: storelayer_recommend_api_storelayer_recommend_get
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 160
          description: Short, non-sensitive capability keywords only. Never include PII or secrets because GET URLs can appear in history, logs, referrers, copied links, and crawler indexes.
          title: Query
        description: Short, non-sensitive capability keywords only. Never include PII or secrets because GET URLs can appear in history, logs, referrers, copied links, and crawler indexes.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Storelayer
  /api/storelayer/jobs:
    get:
      summary: Storelayer Match Jobs
      description: The ten curated developer intents supported by the deterministic matcher.
      operationId: storelayer_match_jobs_api_storelayer_jobs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Storelayer
  /api/storelayer/match:
    post:
      summary: Create Storelayer Match
      description: Record a completed human selection and return its stable match resource.
      operationId: create_storelayer_match_api_storelayer_match_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorelayerMatchInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Storelayer
  /api/storelayer/match/{job_slug}:
    get:
      summary: Storelayer Match Json
      description: Stable JSON match for agents and copyable machine actions.
      operationId: storelayer_match_json_api_storelayer_match__job_slug__get
      parameters:
      - name: job_slug
        in: path
        required: true
        schema:
          type: string
          title: Job Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Storelayer
  /api/storelayer/conversions:
    post:
      summary: Storelayer Conversion Callback
      description: Accept a signed Storelayer conversion matched to a real attributed handoff.
      operationId: storelayer_conversion_callback_api_storelayer_conversions_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Storelayer
  /api/storelayer/verified-installs/{workflow_id}:
    get:
      summary: Get Storelayer Verified Install
      operationId: get_storelayer_verified_install_api_storelayer_verified_installs__workflow_id__get
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      - name: format
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Format
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Storelayer
  /api/storelayer/free-installs/start:
    post:
      summary: Start Storelayer Free Install
      description: Coordinate a caller-applied install; EQBuilder does not host or edit the site.
      operationId: start_storelayer_free_install_api_storelayer_free_installs_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorelayerFreeInstallStart'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Storelayer
  /api/storelayer/free-installs/{workflow_id}/next-action:
    get:
      summary: Storelayer Free Install Next Action
      operationId: storelayer_free_install_next_action_api_storelayer_free_installs__workflow_id__next_action_get
      parameters:
