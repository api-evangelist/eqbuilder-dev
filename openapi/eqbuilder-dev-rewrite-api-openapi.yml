openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: Human-likeness scoring and AI text benchmark API.
  version: 1.0.0
tags:
- name: Rewrite
paths:
  /api/rewrite:
    get:
      summary: Rewrite Quote Get
      description: GET on a paid endpoint returns the same 402 challenge the POST would.
      operationId: rewrite_quote_get_api_rewrite_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Rewrite
    post:
      summary: Paid rewrite — your draft reply rewritten to sound human, with before/after…
      description: 'Paid rewrite (priced like the deep tier, payable in SOL or USDC).

        Send your draft reply plus a target profile; get back a deterministic

        rewrite tuned to that profile''s dials, the exact response delay to use,

        and before/after scores proving the improvement. Your draft is never

        stored — only the two aggregate scores.'
      operationId: api_rewrite_api_rewrite_post
      parameters:
      - name: X-PAYMENT
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Payment
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RewritePayload'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Rewrite
components:
  schemas:
    RewritePayload:
      properties:
        wallet_address:
          type: string
          title: Wallet Address
          default: ''
        tx_hash:
          type: string
          title: Tx Hash
          default: ''
        target_profile:
          type: string
          title: Target Profile
          default: ''
        proposed_text:
          type: string
          title: Proposed Text
          default: ''
        response_delay_seconds:
          type: number
          title: Response Delay Seconds
          default: 0.0
      type: object
      title: RewritePayload
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
