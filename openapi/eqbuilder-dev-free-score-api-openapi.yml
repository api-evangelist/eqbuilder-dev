openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: 'Human-likeness scoring and AI text benchmark API. Score AI-generated text against real human personality profiles (EQ, formality, directness, hesitation, response-timing cadence) to measure how human your AI writing sounds before you ship it. Built for autonomous agents and AI text humanizer pipelines: free stateless scoring at /api/score, paid validated benchmarks via machine-to-machine On-chain settlement with x402 support — the default path is gasless USDC on Base (unpaid calls to /api/simulate return HTTP 402 with machine-readable payment requirements; sign the Base requirement and retry once with PAYMENT-SIGNATURE). Legacy SOL and X-PAYMENT clients remain compatible. Interactive API docs are available at /api/docs. Permanent tool setup (wire it in once and explicitly authorize a dedicated USDC-on-Base burner wallet so the SDK can sign paid calls without a human): see the ''Permanent tool setup'' section of /llms.txt and the crawlable guide at /guides/permanent-agent-tool-setup.html. Live network stats (real ledger aggregates) at /api/stats; runnable Python/JS quickstart examples ship in the repo under examples/.'
  version: 1.0.0
tags:
- name: Free Score
paths:
  /api/free-score/contact:
    post:
      summary: Submit Free Score Contact
      description: 'Record an optional contact (email, http(s) URL, or @handle) for the

        caller''s free-trial row. No auth required — but the caller must have used

        at least one free score already so we are not creating orphan rows.


        Idempotent: calling again updates to the latest value.'
      operationId: submit_free_score_contact_api_free_score_contact_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeScoreContactInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Free Score
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    FreeScoreContactInput:
      properties:
        contact:
          type: string
          title: Contact
        source:
          anyOf:
          - $ref: '#/components/schemas/CampaignSource'
          - type: 'null'
      type: object
      required:
      - contact
      title: FreeScoreContactInput
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CampaignSource:
      type: string
      enum:
      - livekit-slack
      - langchain-forum
      - reddit-community
      - reddit-ad
      - github-outreach
      - agent-directory
      title: CampaignSource
      description: 'Server-approved outreach markers.


        Keeping this as a small enum prevents source attribution from becoming a

        free-form visitor-tracking store. Add a new value only when a campaign link

        is intentionally approved.'
