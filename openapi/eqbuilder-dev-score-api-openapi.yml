openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: 'Human-likeness scoring and AI text benchmark API. Score AI-generated text against real human personality profiles (EQ, formality, directness, hesitation, response-timing cadence) to measure how human your AI writing sounds before you ship it. Built for autonomous agents and AI text humanizer pipelines: free stateless scoring at /api/score, paid validated benchmarks via machine-to-machine On-chain settlement with x402 support — the default path is gasless USDC on Base (unpaid calls to /api/simulate return HTTP 402 with machine-readable payment requirements; sign the Base requirement and retry once with PAYMENT-SIGNATURE). Legacy SOL and X-PAYMENT clients remain compatible. Interactive API docs are available at /api/docs. Permanent tool setup (wire it in once and explicitly authorize a dedicated USDC-on-Base burner wallet so the SDK can sign paid calls without a human): see the ''Permanent tool setup'' section of /llms.txt and the crawlable guide at /guides/permanent-agent-tool-setup.html. Live network stats (real ledger aggregates) at /api/stats; runnable Python/JS quickstart examples ship in the repo under examples/.'
  version: 1.0.0
tags:
- name: Score
paths:
  /api/score:
    post:
      summary: Score Response
      operationId: score_response_api_score_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Score
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CampaignSource:
      type: string
      enum:
      - livekit-slack
      - langchain-forum
      - reddit-community
      - reddit-ad
      - github-outreach
      - agent-directory
      title: CampaignSource
      description: 'Server-approved outreach markers.


        Keeping this as a small enum prevents source attribution from becoming a

        free-form visitor-tracking store. Add a new value only when a campaign link

        is intentionally approved.'
    ScoreInput:
      properties:
        text:
          type: string
          title: Text
        delay_seconds:
          type: number
          title: Delay Seconds
        profile:
          type: string
          title: Profile
        contact:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact
        data_consent:
          type: boolean
          title: Data Consent
          default: false
        bot_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Bot Role
        model_family:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Family
        applied_suggestion:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Applied Suggestion
        wallet_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Wallet Address
        payment_authority_ready:
          type: boolean
          title: Payment Authority Ready
          default: false
        source:
          anyOf:
          - $ref: '#/components/schemas/CampaignSource'
          - type: 'null'
        result_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Result Ref
      type: object
      required:
      - text
      - delay_seconds
      - profile
      title: ScoreInput
