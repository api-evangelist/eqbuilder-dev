openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: Human-likeness scoring and AI text benchmark API.
  version: 1.0.0
tags:
- name: Wishlist
paths:
  /api/wishlist:
    post:
      summary: Submit Wishlist
      description: 'Free feedback channel: bots and developers tell us what they need next.

        Capped per caller; junk is silently quarantined like the training corpus.'
      operationId: submit_wishlist_api_wishlist_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishlistInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Wishlist
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WishlistInput:
      properties:
        need:
          type: string
          title: Need
        audience:
          type: string
          title: Audience
          default: bot
        bot_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Bot Role
      type: object
      required:
      - need
      title: WishlistInput
