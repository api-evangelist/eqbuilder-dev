openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: Human-likeness scoring and AI text benchmark API.
  version: 1.0.0
tags:
- name: Training Dataset
paths:
  /api/training-dataset:
    get:
      summary: Dataset Quote Get
      operationId: dataset_quote_get_api_training_dataset_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Training Dataset
    post:
      summary: Paid export of your wallet's history as fine-tuning-ready records
      description: 'Paid personal dataset export (priced like the deep tier, payable in

        SOL or USDC). The payment itself is the ownership proof — only the

        wallet''s keyholder can pay from that wallet.'
      operationId: api_training_dataset_api_training_dataset_post
      parameters:
      - name: X-PAYMENT
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Payment
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ProgressPayload'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Training Dataset
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ProgressPayload:
      properties:
        wallet_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Wallet Address
        tx_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Tx Hash
      type: object
      title: ProgressPayload
