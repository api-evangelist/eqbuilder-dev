openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: Human-likeness scoring and AI text benchmark API.
  version: 1.0.0
tags:
- name: Embed
paths:
  /api/embed/check:
    post:
      summary: Embedded Eq Check
      description: 'Narrow prepaid-basic proxy target for a company-owned host server.


        The company proxy authenticates its own browser session and forwards only

        this request plus its existing server-held X-BUNDLE-TOKEN. EQBuilder does

        not know the company''s users, cookies, spend ceiling, or rate policy.'
      operationId: embedded_eq_check_api_embed_check_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Timestamped opaque id for this logical check. Reuse it for retries; changing scoring inputs with the same id is a conflict.
          title: Idempotency-Key
        description: Timestamped opaque id for this logical check. Reuse it for retries; changing scoring inputs with the same id is a conflict.
      - name: X-BUNDLE-TOKEN
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Existing prepaid bundle token held by the company proxy.
          title: X-Bundle-Token
        description: Existing prepaid bundle token held by the company proxy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedCheckPayload'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Embed
components:
  schemas:
    EmbeddedCommunicationPreferences:
      properties:
        tone:
          anyOf:
          - type: string
          - type: 'null'
          title: Tone
        audience:
          anyOf:
          - type: string
          - type: 'null'
          title: Audience
        channel:
          anyOf:
          - type: string
          - type: 'null'
          title: Channel
        formality:
          anyOf:
          - type: string
          - type: 'null'
          title: Formality
        directness:
          anyOf:
          - type: string
          - type: 'null'
          title: Directness
        length:
          anyOf:
          - type: string
          - type: 'null'
          title: Length
      additionalProperties: false
      type: object
      title: EmbeddedCommunicationPreferences
      description: Optional host-declared communication intent for contextual guidance.
    EmbeddedCheckPayload:
      properties:
        text:
          type: string
          title: Text
        profile:
          type: string
          title: Profile
          default: analytical_executive
        delay_seconds:
          type: number
          title: Delay Seconds
          default: 4.0
        mode:
          type: string
          title: Mode
          default: structural
        context:
          anyOf:
          - $ref: '#/components/schemas/EmbeddedContext'
          - type: 'null'
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - text
      title: EmbeddedCheckPayload
      description: 'Public browser contract for the company host-proxy target.


        Payment identity, wallet and bundle token are intentionally absent.  The

        host backend authenticates the user and forwards the token server-to-server

        in the existing X-BUNDLE-TOKEN header.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    EmbeddedConversationTurn:
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          title: Role
        content:
          type: string
          title: Content
      additionalProperties: false
      type: object
      required:
      - role
      - content
      title: EmbeddedConversationTurn
      description: One bounded, text-only turn supplied for a contextual assessment.
    EmbeddedContext:
      properties:
        situation:
          type: string
          title: Situation
        desired_outcome:
          anyOf:
          - type: string
          - type: 'null'
          title: Desired Outcome
        constraints:
          anyOf:
          - type: string
          - type: 'null'
          title: Constraints
        conversation:
          items:
            $ref: '#/components/schemas/EmbeddedConversationTurn'
          type: array
          title: Conversation
        communication_preferences:
          anyOf:
          - $ref: '#/components/schemas/EmbeddedCommunicationPreferences'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - situation
      title: EmbeddedContext
      description: Bounded ephemeral identity for an explicit contextual check.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
