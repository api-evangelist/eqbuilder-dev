openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: Human-likeness scoring and AI text benchmark API.
  version: 1.0.0
tags:
- name: Solana
paths:
  /api/solana/balance/{wallet_address}:
    get:
      summary: Get Solana Balance
      description: Return the SOL balance for a Solana wallet address using the public RPC.
      operationId: get_solana_balance_api_solana_balance__wallet_address__get
      parameters:
      - name: wallet_address
        in: path
        required: true
        schema:
          type: string
          title: Wallet Address
      - name: network
        in: query
        required: false
        schema:
          type: string
          pattern: ^(mainnet|devnet|testnet)$
          default: mainnet
          title: Network
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Solana
  /api/solana/history/{wallet_address}:
    get:
      summary: Get Solana History
      description: Return recent transaction signatures for a Solana wallet address.
      operationId: get_solana_history_api_solana_history__wallet_address__get
      parameters:
      - name: wallet_address
        in: path
        required: true
        schema:
          type: string
          title: Wallet Address
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      - name: network
        in: query
        required: false
        schema:
          type: string
          pattern: ^(mainnet|devnet|testnet)$
          default: mainnet
          title: Network
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Solana
  /api/solana/verify:
    post:
      summary: Verify Solana Signature
      description: 'Verify a Solana transaction signature on-chain and enforce double-spend protection.


        1. Checks the local database for a previously verified occurrence of this signature.

        2. If not seen, queries the public Solana RPC to confirm the signature exists on-chain.

        3. Records the signature in solana_verified_signatures (idempotency key) to prevent reuse.


        Returns the on-chain status plus whether this is a new or duplicate verification.'
      operationId: verify_solana_signature_api_solana_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolanaVerifyInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Solana
components:
  schemas:
    SolanaVerifyInput:
      properties:
        signature:
          type: string
          title: Signature
        network:
          type: string
          title: Network
          default: mainnet
      type: object
      required:
      - signature
      title: SolanaVerifyInput
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
