openapi: 3.2.0
info:
  title: EQ Scoring Platform — Human-Likeness & AI Text Benchmark…
  description: 'Human-likeness scoring and AI text benchmark API. Score AI-generated text against real human personality profiles (EQ, formality, directness, hesitation, response-timing cadence) to measure how human your AI writing sounds before you ship it. Built for autonomous agents and AI text humanizer pipelines: free stateless scoring at /api/score, paid validated benchmarks via machine-to-machine On-chain settlement with x402 support — the default path is gasless USDC on Base (unpaid calls to /api/simulate return HTTP 402 with machine-readable payment requirements; sign the Base requirement and retry once with PAYMENT-SIGNATURE). Legacy SOL and X-PAYMENT clients remain compatible. Interactive API docs are available at /api/docs. Permanent tool setup (wire it in once and explicitly authorize a dedicated USDC-on-Base burner wallet so the SDK can sign paid calls without a human): see the ''Permanent tool setup'' section of /llms.txt and the crawlable guide at /guides/permanent-agent-tool-setup.html. Live network stats (real ledger aggregates) at /api/stats; runnable Python/JS quickstart examples ship in the repo under examples/.'
  version: 1.0.0
tags:
- name: Wallet
paths:
  /api/wallet/{wallet_address}/statement:
    get:
      summary: Get Wallet Statement
      description: 'Machine-readable spend & usage statement for a paying wallet.


        Proof of ownership: pass ?auth_tx_hash=. Only the wallet''s keyholder made those payments, and presenting

        one ties the request to the wallet''s own history (fail-closed: an

        unknown or foreign tx hash returns 403). This is the same ownership

        logic the paid training-dataset export uses, without requiring a new

        payment just to read your own meter.


        Operators may bypass auth_tx_hash by supplying a valid X-Admin-Token

        header — the same bearer token used by other admin endpoints.'
      operationId: get_wallet_statement_api_wallet__wallet_address__statement_get
      parameters:
      - name: wallet_address
        in: path
        required: true
        schema:
          type: string
          title: Wallet Address
      - name: auth_tx_hash
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Auth Tx Hash
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Wallet
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
