components:
  schemas:
    AEIObservation:
      properties:
        context:
          type: string
          maxLength: 60
          minLength: 1
          title: Context
          default: community
        channel:
          type: string
          enum:
          - text
          - voice
          - in_person
          title: Channel
          default: text
        pace:
          type: string
          enum:
          - slow
          - fast
          - variable
          title: Pace
          default: variable
        access:
          type: string
          enum:
          - none
          - extra_time
          - alternate_format
          title: Access
          default: none
        state:
          type: string
          enum:
          - ordinary
          - frustration
          - distress
          title: State
          default: ordinary
        distress_signal:
          type: boolean
          title: Distress Signal
          default: false
        communication_preference:
          anyOf:
          - type: string
            enum:
            - brief
            - detailed
          - type: 'null'
          title: Communication Preference
        directness_preference:
          anyOf:
          - type: string
            enum:
            - direct
            - gentle
          - type: 'null'
          title: Directness Preference
        turn_taking_preference:
          anyOf:
          - type: string
            enum:
            - more_space
            - quick_exchange
          - type: 'null'
          title: Turn Taking Preference
        response_preferences:
          anyOf:
          - $ref: '#/components/schemas/AEIResponsePreferences'
          - type: 'null'
        voice_timing:
          anyOf:
          - type: string
            enum:
            - long_pauses
            - rapid_turns
            - steady
          - type: 'null'
          title: Voice Timing
        barrier:
          anyOf:
          - type: string
            enum:
            - unfamiliar_terms
            - noisy_environment
            - alternate_format
            - none
          - type: 'null'
          title: Barrier
        expression:
          anyOf:
          - type: string
            enum:
            - unknown
            - turn_away
            - engaged
          - type: 'null'
          title: Expression
        movement:
          anyOf:
          - type: string
            enum:
            - unknown
            - withdrawn
            - approaching
          - type: 'null'
          title: Movement
        stated_request:
          anyOf:
          - type: string
            enum:
            - more_time
            - different_format
            - human_help
          - type: 'null'
          title: Stated Request
        prior_signals:
          items:
            $ref: '#/components/schemas/AEIPriorSignal'
          type: array
          maxItems: 4
          title: Prior Signals
        message_excerpt:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Message Excerpt
      additionalProperties: false
      type: object
      title: AEIObservation
      description: Host-declared, interaction-scoped cues; no identity or raw sensor feed.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    PreferencesInput:
      properties:
        onsite_contact:
          type: boolean
          title: Onsite Contact
        cadence_days:
          type: integer
          title: Cadence Days
      additionalProperties: false
      type: object
      required:
      - onsite_contact
      - cadence_days
      title: PreferencesInput
    FeedbackInput:
      properties:
        helpfulness:
          type: string
          title: Helpfulness
        felt_respected:
          type: boolean
          title: Felt Respected
      additionalProperties: false
      type: object
      required:
      - helpfulness
      - felt_respected
      title: FeedbackInput
    EnrollInput:
      properties:
        consent:
          type: boolean
          title: Consent
        privacy_ack:
          type: boolean
          title: Privacy Ack
        model_consent:
          type: boolean
          title: Model Consent
        onsite_contact:
          type: boolean
          title: Onsite Contact
        cadence_days:
          type: integer
          title: Cadence Days
      additionalProperties: false
      type: object
      required:
      - consent
      - privacy_ack
      - model_consent
      - onsite_contact
      - cadence_days
      title: EnrollInput
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    AEICompanyCheckout:
      properties:
        overage_opt_in:
          type: boolean
          title: Overage Opt In
          default: false
        monthly_spend_ceiling_cents:
          type: integer
          maximum: 100000.0
          minimum: 0.0
          title: Monthly Spend Ceiling Cents
          default: 0
      additionalProperties: false
      type: object
      title: AEICompanyCheckout
    ModelConsentInput:
      properties:
        model_consent:
          type: boolean
          title: Model Consent
      additionalProperties: false
      type: object
      required:
      - model_consent
      title: ModelConsentInput
    AEICompanyClaim:
      properties:
        checkout_id:
          type: string
          maxLength: 120
          minLength: 4
          title: Checkout Id
        claim_secret:
          type: string
          maxLength: 200
          minLength: 20
          title: Claim Secret
      additionalProperties: false
      type: object
      required:
      - checkout_id
      - claim_secret
      title: AEICompanyClaim
    Review:
      properties:
        case_id:
          type: string
          title: Case Id
        A:
          $ref: '#/components/schemas/Ratings'
        B:
          $ref: '#/components/schemas/Ratings'
      additionalProperties: false
      type: object
      required:
      - case_id
      - A
      - B
      title: Review
    AEIResponsePreferences:
      properties:
        consent:
          type: boolean
          const: true
          title: Consent
        communication_preference:
          anyOf:
          - type: string
            enum:
            - brief
            - detailed
          - type: 'null'
          title: Communication Preference
        directness_preference:
          anyOf:
          - type: string
            enum:
            - direct
            - gentle
          - type: 'null'
          title: Directness Preference
        turn_taking_preference:
          anyOf:
          - type: string
            enum:
            - more_space
            - quick_exchange
          - type: 'null'
          title: Turn Taking Preference
      additionalProperties: false
      type: object
      required:
      - consent
      title: AEIResponsePreferences
      description: Current, consented snapshot supplied by the host, never a server profile.
    AEIOutcomeReport:
      properties:
        guidance_receipt:
          type: string
          maxLength: 1024
          minLength: 40
          title: Guidance Receipt
        consent:
          type: boolean
          const: true
          title: Consent
        applied_action:
          type: string
          enum:
          - listen
          - clarify
          - offer_choice
          - proceed
          - pause_and_handoff
          title: Applied Action
        outcome:
          type: string
          enum:
          - helped
          - not_helped
          - unclear
          - handoff
          title: Outcome
      additionalProperties: false
      type: object
      required:
      - guidance_receipt
      - consent
      - applied_action
      - outcome
      title: AEIOutcomeReport
      description: Only closed-vocabulary, host-attested outcomes; no transcript or person IDs.
    Consent:
      properties:
        consent:
          type: boolean
          title: Consent
      additionalProperties: false
      type: object
      required:
      - consent
      title: Consent
    ReplyInput:
