apis:
- name: Marz Greta-Lock Network MCP Server
  description: >-
    Official remote MCP server (streamable HTTP, protocol 2025-06-18) at https://eqbuilder.dev/api/mcp
    with no authentication. Eight free, read-only tools — score_text (three trial scores), list_profiles,
    get_pricing, preview_fee, get_network_stats, request_feature, storelayer_recommend, storelayer_widget_menu
    — and one resource; every tool binds to a REST operation. Paid x402 operations are deliberately REST-only.
    Registered in the official MCP registry namespace dev.eqbuilder (/.well-known/mcp.json, /.well-known/mcp-registry-auth)
    and listed on Glama.
  humanURL: https://eqbuilder.dev/guides/permanent-agent-tool-setup.html
  baseURL: https://eqbuilder.dev/api/mcp
  tags:
  - MCP
  - AI Agents
  - EQ Scoring
  properties:
  - type: MCPServer
    url: mcp/eqbuilder-dev-mcp.yml
  - type: ToolCrosswalk
    url: mcp/eqbuilder-dev-tool-crosswalk.yml
  - type: Documentation
    url: https://eqbuilder.dev/guides/permanent-agent-tool-setup.html
- name: Marz Greta-Lock Network A2A Agent Card
  description: >-
    A2A agent card served at /.well-known/agent-card.json (aliases /.well-known/agent.json and /.well-known/agents.json):
    protocolVersion 1.0, six skills (agent-buy-and-run, storelayer-recommend, storelayer-widget-menu,
    eq-score, eq-rewrite, script-check), streaming and push notifications false. Graded near-conformant:
    all hard checks pass but preferredTransport and default modes are absent, and the card url is the
    website — no A2A message transport is served; the card routes agents to the REST OpenAPI and the MCP
    endpoint through a non-standard protocols key.
  humanURL: https://eqbuilder.dev/
  tags:
  - A2A
  - AI Agents
  - Agent Discovery
  properties:
  - type: AgentCard
    url: a2a/eqbuilder-dev-a2a.yml
  - type: AgentCard
    url: https://eqbuilder.dev/.well-known/agent-card.json
