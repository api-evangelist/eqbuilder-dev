apis:
- name: EQ Scoring Platform API
  description: 'REST API (OpenAPI 3.1, 133 operations) for scoring AI-generated text against 28 human personality
    profiles. Free anonymous surface: three lifetime scores per caller (POST /api/score with data_consent), profiles,
    pricing, stats, leaderboard, certificates, price quotes. Paid surface authorized by x402 payment (PAYMENT-SIGNATURE,
    USDC on Base by default; legacy X-PAYMENT/Solana): validated benchmark sessions, deep analysis, rewrites, stress
    tests, progress reports, training-dataset export, script-adherence checks, duels, role-play rooms and coaching
    packs; prepaid credits via X-BUNDLE-TOKEN (x402 bundle or card packs). Also carries the Storelayer catalog/recommendation/self-install
    endpoints and an operator/admin surface behind X-Admin-Token.'
  humanURL: https://eqbuilder.dev/api/docs
  baseURL: https://eqbuilder.dev/api
