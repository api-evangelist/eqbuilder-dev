- name: Marz Greta-Lock Network A2A Agent Card
  description: 'A2A agent card served at /.well-known/agent-card.json (aliases /.well-known/agent.json and /.well-known/agents.json):
    protocolVersion 1.0, six skills (agent-buy-and-run, storelayer-recommend, storelayer-widget-menu, eq-score,
    eq-rewrite, script-check), streaming and push notifications false. Graded near-conformant: all hard checks pass
    but preferredTransport and default modes are absent, and the card url is the website — no A2A message transport
    is served; the card routes agents to the REST OpenAPI and the MCP endpoint through a non-standard protocols
    key.'
  humanURL: https://eqbuilder.dev/
  baseURL: https://eqbuilder.dev
  tags:
  - A2A
  - AI Agents
  - Agent Discovery
  properties:
