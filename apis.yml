- name: Marz Greta-Lock Network MCP Server
  description: Official remote MCP server (streamable HTTP, protocol 2025-06-18) at https://eqbuilder.dev/api/mcp
    with no authentication. Eight free, read-only tools — score_text (three trial scores), list_profiles, get_pricing,
    preview_fee, get_network_stats, request_feature, storelayer_recommend, storelayer_widget_menu — and one resource;
    every tool binds to a REST operation. Paid x402 operations are deliberately REST-only. Registered in the official
    MCP registry namespace dev.eqbuilder (/.well-known/mcp.json, /.well-known/mcp-registry-auth) and listed on Glama.
  humanURL: https://eqbuilder.dev/guides/permanent-agent-tool-setup.html
  baseURL: https://eqbuilder.dev/api/mcp
  tags:
  - MCP
  - AI Agents
  - EQ Scoring
  properties:
  - type: MCPServer
    url: mcp/eqbuilder-dev-mcp.yml
  - type: ToolCrosswalk
    url: mcp/eqbuilder-dev-tool-crosswalk.yml
  - type: Documentation
