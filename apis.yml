aid: eqbuilder-dev
name: Marz Greta-Lock Network
description: 'Marz Greta-Lock Network operates eqbuilder.dev, an EQ benchmark for AI agents: a machine-to-machine
  API that scores AI-generated text for human-likeness against 28 human personality profiles (EQ, formality, directness,
  hesitation, punctuation, response-delay cadence) with deterministic statistics and no LLM calls, returns a ready-to-paste
  system-prompt fix with every score, and sells validated benchmarks, deep analysis, rewrites, script-adherence
  checks, bot-vs-bot duels, role-play rooms and coaching packs per call through x402 v2 (gasless USDC on Base, legacy
  Solana) or prepaid card credit packs. The surface is published as an OpenAPI 3.1 document (133 operations), a
  free anonymous remote MCP server (8 tools), an A2A agent card, an OpenAI plugin manifest, an x402 payable-resource
  catalog, llms.txt and first-party Python and Node SDKs; it also hosts a read-only recommendation matcher over
  the third-party Storelayer storefront-widget catalog.'
url: https://raw.githubusercontent.com/api-evangelist/eqbuilder-dev/refs/heads/main/apis.yml
image: https://eqbuilder.dev/logo.png
x-type: company
x-source: harvest:a2a-registry
x-tier: profiled
x-tier-reason: enrichment pass 2026-09-19 (local-v3; was a2a-registry harvest stub)
specificationVersion: '0.20'
created: '2026-09-19'
modified: '2026-10-06'
tags:
- Company
- AI Agents
- Agent Evaluation
- Benchmarking
- Text Analysis
- Emotional Intelligence
- Conversational AI
- x402
- Agentic Payments
- MCP
- A2A
- Developer Tools
tags_raw:
