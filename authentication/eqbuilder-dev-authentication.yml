notes: '"The platform holds no private keys." The recommended posture (llms.txt) is a dedicated burner wallet funded
  with USDC on Base that the SDK signs with; the SDKs never auto-replay a paid authorization after a timeout. MCP
  is anonymous and read-only; RFC 9728 protected-resource metadata is not published (404) and is not needed.'
