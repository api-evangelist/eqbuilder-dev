overlay: 1.0.0
info:
  title: API Evangelist overlay for the EQ Scoring Platform API
  version: 1.0.0
  description: Enhancements API Evangelist applies on top of the published OpenAPI 3.1.0 document (https://eqbuilder.dev/openapi.json,
    harvested 2026-09-19; 133 operations, no servers, no tags, no securitySchemes). Adds the resolved server, a
    tag per capability group, security schemes for the payment/token headers the provider documents only as header
    parameters and prose, and marks the retired /api/train operation deprecated — without touching the original.
extends: openapi/eqbuilder-dev-openapi.yml
x-generated: '2026-09-19'
x-method: generated
actions:
- target: $.servers
  update:
  - url: https://eqbuilder.dev
    description: 'Resolved by API Evangelist: the published document declares no servers[]; paths carry their /api
      prefix and every documented URL resolves against https://eqbuilder.dev'
- target: $.info
  update:
    contact:
      name: Marz Greta-Lock Network
      url: https://eqbuilder.dev/integrate
    x-apievangelist-provenance:
      fetched: '2026-09-19'
      url: https://eqbuilder.dev/openapi.json
      http_status: 200
      llms_txt: https://eqbuilder.dev/llms.txt
      agent_card: https://eqbuilder.dev/.well-known/agent-card.json
      mcp: https://eqbuilder.dev/api/mcp
- target: $.tags
  update:
  - name: Scoring
  - name: Duels & Arena
  - name: Role-play & Coaching
  - name: Credits & Payments
  - name: Storelayer
  - name: Discovery
  - name: Operator & Admin
  - name: Public Results & Stats
- target: $.components.securitySchemes
  update:
    x402Payment:
      type: apiKey
      in: header
      name: PAYMENT-SIGNATURE
      description: Canonical x402 v2 payment payload (EIP-3009 USDC authorization). Obtain the requirements from
        the HTTP 402 body, sign, retry once. Documented in prose + header parameters; not declared by the provider.
    legacyXPayment:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: Legacy x402 payment header, still accepted.
    bundleToken:
      type: apiKey
      in: header
      name: X-BUNDLE-TOKEN
      description: Secret prepaid-credit token from POST /api/bundle or POST /api/card/claim.
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Operator/admin surface only.
    operatorSession:
      type: apiKey
      in: cookie
      name: operator_session
      description: HttpOnly session cookie issued by POST /api/operator/login (cookie name inferred from the operation
        description, not declared).
- target: $.paths['/api/train'].post
  update:
    deprecated: true
    x-apievangelist-observed: POST returns HTTP 410 endpoint_retired with replacement /api/simulate (2026-09-19);
      /api/pricing train_endpoint.status "retired"
